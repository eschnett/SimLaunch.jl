# Nibi (Alliance / SHARCNET). Facts from the nibi-hpc skill, checked on the
# cluster on 2026-10-19.
name = "nibi"

[connect]
host = "nibi"
check = "ssh -O check nibi"            # MFA: never open a new connection
hint = "run: ssh -fN nibi"

[paths]
code = "/home/eschnett/claude/studies"
scratch = "/scratch/eschnett/claude/studies"

[slurm]
account = "def-eschnett"
partition = false                      # the submit filter chooses, by time and size
max_time = "7-00:00:00"                # shorter starts sooner: 3 h, 12 h, 24 h, 3 d, 7 d bins
node = { cores = 192, numa = 6, mem = "766000M", header = ["--exclusive", "--mem=0"] }

[slurm.gpu]                            # H100, 80 GB; not yet run through SimLaunch
request = "--gpus=h100:%d"
cores = 12                             # per GPU; at most 14
mem = "120G"                           # per GPU; at most about 250G
max = 8
arch = "h100"

# Architectures: name = JULIA_CPU_TARGET. The login node (Sapphire Rapids) has its
# own, so both kinds of node compile in a job.
[arch]
granite = "native"                     # CPU nodes: Xeon 6972P (Granite Rapids)
h100 = "native"                        # GPU nodes: Xeon 8570

[julia]
bin = "~/.juliaup/bin/julia"
modules = []
arch = "granite"
precompile_time = "0:30:00"
compute_internet = true

[mpi]
default = "system"                     # for a run that names no recipe

[mpi.jll]                              # MPICH_jll: much slower between nodes than the system's
launcher = "srun"
launcher_args = ["--mpi=pmi2"]
env = { OMP_NUM_THREADS = "1" }

# Open MPI 4.1.5 of StdEnv/2023 through mpi_abi_wrapper. juliaup's Julia cannot
# load it; the patched one can. Four ranks ran on one node on 2026-11-17 (job 27652961).
[mpi.system]
julia = "~/claude/julia-1.13.4-nibi/bin/julia"
modules = ["StdEnv/2023"]              # also sets the OMPI_MCA variables that keep Open MPI off libfabric
launcher = "srun"
launcher_args = ["--mpi=pmix"]
env = { OMP_NUM_THREADS = "1" }
[mpi.system.preferences]
library_names = ["/home/eschnett/claude/openmpi-4.1.5-mpi-abi/lib64/libmpi_abi.so"]
mpiexec = "/home/eschnett/claude/openmpi-4.1.5-mpi-abi/bin/mpiexec"
abi = "MPIABI"
