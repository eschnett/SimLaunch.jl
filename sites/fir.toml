# Fir (Alliance / SFU).
# Checked on the cluster on 2026-11-15.
name = "fir"

[connect]
host = "fir"
check = "ssh -O check fir"             # MFA: never open a new connection
hint = "run: ssh -fN fir"

# The entries in <...> are yours to give, in a profile of your own that starts
# with `base = "fir"`: see SITES.md.
[paths]
code = "<a directory for the studies' sources, such as /home/USER/simlaunch/studies>"   # home has 48 GiB and 500K files: sources only
scratch = "<a directory for the runs' output, such as /scratch/USER/simlaunch/studies>"

[slurm]
account = "<your Slurm account, such as def-NAME>"

# Kinds of node, in the order of preference. No queues: the submit filter chooses the
# partition, by time and size; shorter starts sooner: 3 h, 12 h, 24 h, 3 d, 7 d bins.
[[slurm.nodes]]
name = "cpu"
cores = 192
numa = 8
mem = "768000M"
header = ["--exclusive", "--mem=0"]
arch = "zen5"
max_time = "7-00:00:00"

[[slurm.nodes]]                        # H100, 80 GB; a one-GPU job ran on 2026-11-16 (4409948)
name = "h100"
gpus = { request = "--gpus=h100:%d", cores = 12, mem = "250G", max = 4 }   # per GPU: 12 cores, at most about 280G
arch = "zen4"                          # compiled in a job
max_time = "7-00:00:00"

# Architectures: name = JULIA_CPU_TARGET.
[arch]
zen5 = "native"                        # the login and CPU nodes
zen4 = "native"                        # the GPU nodes

[julia]
bin = "~/.juliaup/bin/julia"
modules = []
login_arch = "zen5"                    # so the login node compiles for the CPU nodes
precompile_tasks = 8                   # login nodes are shared
compute_internet = true

[mpi]
default = "jll"                        # for a run that names no recipe; `mpiabi` is faster once it is set up

[mpi.jll]                              # MPICH_jll: much slower between nodes than the system's
launcher = "srun"
launcher_args = ["--mpi=pmi2"]
env = { OMP_NUM_THREADS = "1" }

# Open MPI 4.1.5 of StdEnv/2023 through mpi_abi_wrapper. juliaup's Julia cannot
# load it; the patched one can. Not run through SimLaunch yet.
[mpi.mpiabi]
binary = "system"                      # the site's own MPI
julia = "<a Julia that can load the cluster's MPI: a copy patched with setrpaths.sh>"
modules = ["StdEnv/2023"]              # also sets the OMPI_MCA variables that keep Open MPI off libfabric
launcher = "srun"
launcher_args = ["--mpi=pmix"]
env = { OMP_NUM_THREADS = "1" }
[mpi.mpiabi.preferences]
library_names = ["<your build of mpi_abi_wrapper: .../lib64/libmpi_abi.so>"]
mpiexec = "<your build of mpi_abi_wrapper: .../bin/mpiexec>"
abi = "MPIABI"
