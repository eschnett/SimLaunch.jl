# Fir (Alliance / SFU). Facts from the fir-hpc skill, checked on the cluster
# on 2026-11-15.
name = "fir"

[connect]
host = "fir"
check = "ssh -O check fir"             # MFA: never open a new connection
hint = "run: ssh -fN fir"

[paths]
code = "/home/eschnett/claude/studies"   # home has 48 GiB and 500K files: sources only
scratch = "/scratch/eschnett/claude/studies"

[slurm]
account = "def-eschnett"
partition = false                      # the submit filter chooses, by time and size
max_time = "7-00:00:00"                # shorter starts sooner: 3 h, 12 h, 24 h, 3 d, 7 d bins
node = { cores = 192, numa = 8, mem = "768000M", header = ["--exclusive", "--mem=0"] }

[slurm.gpu]                            # H100, 80 GB; a one-GPU job ran on 2026-11-16 (4409948)
request = "--gpus=h100:%d"
cores = 12                             # per GPU: 48 cores for 4 GPUs
mem = "250G"                           # per GPU; at most about 280G
max = 4
arch = "zen4"                          # compiled in a job

# Architectures: name = JULIA_CPU_TARGET.
[arch]
zen5 = "native"                        # the login and CPU nodes
zen4 = "native"                        # the GPU nodes

[julia]
bin = "~/.juliaup/bin/julia"
modules = []
arch = "zen5"
login_arch = "zen5"                    # so the login node compiles for the CPU nodes
precompile_tasks = 8                   # login nodes are shared
compute_internet = true

[mpi]
default = "system"                     # for a run that names no recipe

[mpi.jll]                              # MPICH_jll: much slower between nodes than the system's
launcher = "srun"
launcher_args = ["--mpi=pmi2"]
env = { OMP_NUM_THREADS = "1" }

# Open MPI 4.1.5 of StdEnv/2023 through mpi_abi_wrapper. juliaup's Julia cannot
# load it; the patched one can. Not run through SimLaunch yet.
[mpi.system]
julia = "~/claude/julia-1.13.4-fir/bin/julia"
modules = ["StdEnv/2023"]              # also sets the OMPI_MCA variables that keep Open MPI off libfabric
launcher = "srun"
launcher_args = ["--mpi=pmix"]
env = { OMP_NUM_THREADS = "1" }
[mpi.system.preferences]
library_names = ["/home/eschnett/claude/openmpi-4.1.5-mpi-abi/lib64/libmpi_abi.so"]
mpiexec = "/home/eschnett/claude/openmpi-4.1.5-mpi-abi/bin/mpiexec"
abi = "MPIABI"
