# Trillium's CPU cluster (Alliance / SciNet).
# Checked on the cluster on 2026-11-15.
name = "trillium"

[connect]
host = "trillium"
check = "ssh -O check trillium"      # MFA: never open a new connection
hint = "run: ssh -fN trillium"

# The entries in <...> are yours to give, in a profile of your own that starts
# with `base = "trillium"`: see SITES.md.
[paths]
code = "<a directory for the studies' sources, such as /home/USER/simlaunch/studies>"       # read-only in jobs
scratch = "<a directory for the runs' output, such as /scratch/USER/simlaunch/studies>"

[slurm]
account = "<your Slurm account, such as def-NAME>"
export_env = false                     # sbatch runs with --export=NONE
node = { cores = 192, numa = 8, mem = "767000M", whole = true }
queues = [                             # in the order of preference
  { partition = "debug",   max_time = "1:00:00",  max_nodes = 4, one_at_a_time = true },
  { partition = "compute", min_time = "0:15:00", max_time = "24:00:00" },   # sbatch refuses less than 15 min
]

[julia]
bin = "~/.juliaup/bin/julia"
modules = []                           # a pure Julia job needs none
# No [arch] table: one architecture. The login node is Zen 5 like the compute nodes, and compiles for them.
precompile_tasks = 8                   # login nodes are shared
compute_internet = false               # prepare fetches everything; jobs run offline

[mpi]
default = "jll"                        # for a run that names no recipe; `mpiabi` is faster once it is set up

[mpi.jll]                              # MPICH_jll: six times slower between nodes than the system's
launcher = "srun"
launcher_args = ["--mpi=pmi2"]
env = { OMP_NUM_THREADS = "1" }

# Open MPI 4.1.5 of StdEnv/2023 through mpi_abi_wrapper. juliaup's Julia cannot
# load it; the patched one can. Both recipes ran on one and two nodes on 2026-11-16.
[mpi.mpiabi]
binary = "system"                      # the site's own MPI
julia = "<a Julia that can load the cluster's MPI: a copy patched with setrpaths.sh>"
modules = ["StdEnv/2023"]              # also sets the OMPI_MCA variables that keep Open MPI off libfabric
launcher = "srun"
launcher_args = ["--mpi=pmix"]
env = { OMP_NUM_THREADS = "1" }
[mpi.mpiabi.preferences]
library_names = ["<your build of mpi_abi_wrapper: .../lib64/libmpi_abi.so>"]
mpiexec = "<your build of mpi_abi_wrapper: .../bin/mpiexec>"
abi = "MPIABI"

[env]
JULIA_PKG_OFFLINE = "true"
