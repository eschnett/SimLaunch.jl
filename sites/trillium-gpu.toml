# Trillium's GPU cluster (Alliance / SciNet): a Slurm cluster of its own,
# with its own login node.
# Checked on the cluster on 2026-11-15.
name = "trillium-gpu"

[connect]
host = "trillium"                      # files go here: both clusters see the same file systems
via = "trig-login01"                   # commands run here, reached from a tri-login node
check = "ssh -O check trillium"        # MFA: never open a new connection
hint = "run: ssh -fN trillium"

# The entries in <...> are yours to give, in a profile of your own that starts
# with `base = "trillium-gpu"`: see SITES.md.
[paths]
# not the CPU cluster's directories: the two prepare for different CPUs
code = "<a directory for the studies' sources, such as /home/USER/simlaunch/studies-gpu>"          # read-only in jobs
scratch = "<a directory for the runs' output, such as /scratch/USER/simlaunch/studies-gpu>"

[slurm]
account = "<your Slurm account, such as def-NAME>"
export_env = false                     # sbatch runs with --export=NONE

[[slurm.nodes]]                        # H100, 80 GB
name = "h100"
# per GPU 24 cores, with 192000 M; given, not asked for
gpus = { request = "--gpus-per-node=%d", cores = 24, request_cores = false, max = 4 }
# A job with all 4 GPUs of a node is a whole-node job: the site takes it only in the
# *_full_node partitions, and a smaller job only in the others.
queues = [                             # in the order of preference
  { partition = "debug",             max_time = "2:00:00",  max_gpus = 3, one_at_a_time = true },
  { partition = "debug_full_node",   max_time = "1:00:00",  min_gpus = 4, one_at_a_time = true },
  { partition = "compute",           max_time = "24:00:00", max_gpus = 3 },
  { partition = "compute_full_node", max_time = "24:00:00", min_gpus = 4 },
]

[julia]
bin = "~/.juliaup/bin/julia"
modules = []
# No [arch] table: one architecture. trig-login01 is Zen 4 with H100s, like the compute nodes, and compiles for them.
precompile_tasks = 8                   # login nodes are shared
compute_internet = false               # prepare fetches everything; jobs run offline

[mpi]
default = "mpiabi"                     # for a run that names no recipe

# Open MPI 4.1.5 of StdEnv/2023 (built with CUDA) through mpi_abi_wrapper, as on the CPU
# side, which shares its home. Under the wrapper's mpiexec: srun is not for a GPU job.
# Two ranks on an H100 exchanged host and device buffers on 2026-11-17 (job 1355034).
[mpi.mpiabi]
binary = "system"                      # the site's own MPI
julia = "<a Julia that can load the cluster's MPI: a copy patched with setrpaths.sh>"   # juliaup's Julia cannot load the site's MPI
modules = ["StdEnv/2023", "cuda/12.9"]   # StdEnv sets the OMPI_MCA variables that keep Open MPI off libfabric; cuda swaps in the UCX that knows device memory
launcher = "mpiexec"
launcher_args = ["--bind-to", "none"]  # else Open MPI binds a rank, and all its threads, to one core
env = { OMP_NUM_THREADS = "1" }
[mpi.mpiabi.preferences]
library_names = ["<your build of mpi_abi_wrapper: .../lib64/libmpi_abi.so>"]
mpiexec = "<your build of mpi_abi_wrapper: .../bin/mpiexec>"
abi = "MPIABI"

[env]
JULIA_PKG_OFFLINE = "true"
