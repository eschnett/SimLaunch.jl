name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12', '1']
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      # The tests load the package, generate the batch scripts and compare
      # them with test/reference/, and run real jobs on the runner: locally,
      # and under the stand-ins for sbatch, squeue, scancel and scontrol. They need
      # bash, rsync and git, which the runners have, and no cluster.
      - uses: julia-actions/julia-runtest@v1
      # Coverage counts the Julia code that runs in the test process. The
      # generated scripts, and the Julia processes they start, are not in it.
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: The command line starts
        run: julia --project=. -m SimLaunch sites
