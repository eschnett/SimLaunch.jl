# A cluster that does not exist, for the tests: CPU nodes of two generations in
# the same partitions, one odd node, GPU nodes, pre-emptible queues, and a
# login node with another CPU.
name = "kepler"

[connect]
host = "kepler"
check = "ssh -o BatchMode=yes -o ConnectTimeout=10 kepler true"
hint = "open the tunnel"

[paths]
code = "/home/user/studies"
scratch = "/scratch/user/studies"

[slurm]
# The AMD partitions hold Zen 2 and Zen 3 nodes (EPYC 7532, 7543), and cn112, which is
# another machine: an EPYC 8534P (Zen 4c, AVX-512) with 384 GB and fewer NUMA domains.
# A job in them keeps off cn112, and cn112 is used through largememq, which holds only it.
# (It would be simpler if the AMD partitions did not list cn112.)
node = { cores = 64, numa = 8, mem = "256G", header = ["--exclusive"] }
queues = [                             # in the order of preference: amddebugq starts much sooner
  { partition = "amddebugq", max_time = "1:00:00",  max_nodes = 1,  header = ["--exclude=cn112"] },
  { partition = "amdq",      max_time = "24:00:00", max_nodes = 16, header = ["--exclude=cn112"] },
  # stopped whenever the queues above need its node: SIGTERM, then SIGKILL after 30 s
  { partition = "amdpreq",   max_time = "24:00:00", max_nodes = 8, preempt = true, header = ["--exclude=cn112"] },
  # cn112 alone: only for a job that names the queue. Its NUMA domains are counted when a run starts.
  { partition = "largememq", max_time = "24:00:00", max_nodes = 1, on_request = true, arch = "zen4c" },
]

[slurm.gpu]                            # H200, 141 GB
request = "--gres=gpu:h200:%d"
cores = 8                              # per GPU; more often blocks on the group's limits
mem = "64G"                            # per GPU; always given, the default is 21 GB per core
max = 8
arch = "h200"
queues = [
  { partition = "h200debugq", max_time = "1:00:00",  max_gpus = 2, chain = false },   # to get started; never chained
  { partition = "h200q",      max_time = "24:00:00" },
  # no group limits, but stopped whenever h200q needs the GPUs: SIGTERM, then SIGKILL after 30 s
  # preferred by a job with checkpoints: h200q is often full
  { partition = "h200preq",   max_time = "24:00:00", preempt = true, prefer = true },
]

# Architectures: name = JULIA_CPU_TARGET. Nodes of one architecture share a study's
# compiled caches, and a job sees no others. The login node (Intel) has its own.
[arch]
# One cache for the two AMD generations of the AMD partitions (EPYC 7532, 7543): Zen 2
# code, which a Zen 3 node runs as well. Without a named target, what one generation
# compiles is rejected on the other.
# No `generic` part: a node that cannot run Zen 2 code must refuse the cache, not
# run it slowly, as the H200 nodes did with FastPower.
amd = "znver2"
zen4c = "native"                       # cn112, in largememq: EPYC 8534P
h200 = "native"                        # Sapphire Rapids: cn111 is a Xeon Gold 6442Y, cn113 a Platinum 8452Y

[julia]
bin = "~/.juliaup/bin/julia"
modules = []
arch = "amd"                           # the CPU nodes; compiled in a job, as the login node is Intel
precompile_time = "0:30:00"
compute_internet = true

[mpi]
default = "mpiabi"                     # for a run that names no recipe

# MPICH_jll under srun; the variable keeps MPICH from crashing in its first collective.
[mpi.jll]
launcher = "srun"
launcher_args = ["--mpi=pmi2"]
env = { MPIR_CVAR_CH4_SHM_POSIX_RELEASE_GATHER_ENABLE = "0", OMP_NUM_THREADS = "1" }

# MPICH_jll under its own mpiexec, Hydra forking the ranks: one node, as the GPU jobs need.
[mpi.jll-fork]
binary = "jll"
launcher = "mpiexec"
env = { HYDRA_LAUNCHER = "fork", MPIR_CVAR_CH4_SHM_POSIX_RELEASE_GATHER_ENABLE = "0", OMP_NUM_THREADS = "1" }

# HPC-X's Open MPI 4.1.7, CUDA-aware, through mpi_abi_wrapper (MPI.jl's abi "MPIABI"),
# under its own mpiexec: for CPU and for GPU jobs, on one node or several. Ran on an AMD
# node and on an H200 with device buffers on 2026-11-17.
[mpi.mpiabi]
binary = "system"                      # the site's own MPI
modules = ["nvhpc-hpcx-cuda12/24.9"]
launcher = "mpiexec"
launcher_args = ["--bind-to", "none"]  # else Open MPI binds a rank, and all its threads, to one core
multi_node = true
env = { OMP_NUM_THREADS = "1" }
[mpi.mpiabi.preferences]
library_names = ["/home/user/hpcx-2.20-mpi-abi/lib/libmpi_abi.so"]
mpiexec = "/home/user/hpcx-2.20-mpi-abi/bin/mpiexec"
abi = "MPIABI"

# The same Open MPI loaded by MPI.jl itself, without the wrapper. Ran on CPU nodes and
# with two H200s (device buffers handed to MPI) on 2026-11-16, first under the name `system`.
[mpi.hpcx]
binary = "system"
modules = ["nvhpc-hpcx-cuda12/24.9"]
launcher = "mpiexec"
launcher_args = ["--bind-to", "none"]
multi_node = true
env = { OMP_NUM_THREADS = "1" }
